name: abi

# ABI compatibility gate (libabigail). Post-1.0, every library's exported
# surface must stay compatible across patch releases and additive across
# minor releases. The reference ABI is dumped from the previous tag; a PR
# that changes it fails here with a typed report (fn-symbol / fn-para /
# data-member kind) instead of breaking a downstream consumer silently.
#
# Pre-1.0 there is no binary compatibility promise (docs/reference/api.md):
# the SONAME carries the full X.Y.Z, so a binary built against one release
# fails to load another instead of silently reading a changed descriptor.
# The gate still reports every difference for review, but only post-1.0
# differences fail. The pre-1.0 invariant it enforces is that the SONAME
# actually carries the full version.
#
# Reference: the most recent tag reachable from this commit (typically
# the previous release). A release commit itself compares against the
# release before it, so every release-to-release ABI diff is reviewed.
#
# Suppressible: genuine intentional post-1.0 breaks are recorded in
# tools/config/abi-supprs.abignore — the suppression file is part of the
# review, not a shadow valve.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  CC: clang
  CXX: clang++

jobs:
  abidiff:
    name: ABI compatibility (abidiff vs last tag)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for the reference build

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies + libabigail
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config abigail-tools \
            glslang-tools libvulkan-dev libfreetype-dev libharfbuzz-dev \
            libfontconfig1-dev libfribidi-dev

      # The reference tag still compiles GLSL; the current tree needs Slang.
      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - name: Determine reference tag
        id: ref
        run: |
          # Latest tag on the merge base (not on HEAD — HEAD's tag would
          # be this PR's own release). Falls back to the most recent tag
          # overall when the base carries none (early history).
          base="${{ github.event.pull_request.base.sha }}"
          base="${base:-${{ github.sha }}~1}"
          tag=$(git describe --tags --abbrev=0 "$base" 2>/dev/null || \
                git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No reference tag — nothing to compare against yet."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Comparing against $tag"
          fi

      - name: Build reference (tagged) libraries
        if: steps.ref.outputs.skip != 'true'
        run: |
          git worktree add /tmp/abi-ref "${{ steps.ref.outputs.tag }}"
          meson setup /tmp/abi-ref/build /tmp/abi-ref \
            -Dtests=false -Dexamples=false --buildtype=debug \
            -Dfreetype2:harfbuzz=disabled -Dharfbuzz:cairo=disabled
          meson compile -C /tmp/abi-ref/build

      - name: Build current (PR) libraries
        if: steps.ref.outputs.skip != 'true'
        run: |
          meson setup build-abi -Dtests=false -Dexamples=false \
            --buildtype=debug \
            -Dfreetype2:harfbuzz=disabled -Dharfbuzz:cairo=disabled
          meson compile -C build-abi

      # One abidiff per library, against the same-named reference .so.
      # --leaf-changes-only keeps the report to the leaf differences
      # (what a consumer actually sees); --impacted-interfaces lists the
      # affected symbols when something breaks.
      - name: Compare ABIs
        if: steps.ref.outputs.skip != 'true'
        run: |
          set -e
          version=$(sed -n "s/^  version : '\([^']*\)'.*/\1/p" meson.build | head -1)
          major=${version%%.*}
          REF_LIBS=$(find /tmp/abi-ref/build -type f -name 'lib*.so.*' ! -name '*.symbols' | sort)
          FAIL=0
          for ref in $REF_LIBS; do
            name=$(basename "$ref" | sed 's/\.so\..*//')
            cur=$(find build-abi -type f -name "${name}.so.*" ! -name '*.symbols' | head -1)
            if [ -z "$cur" ]; then
              echo "FAIL: $name missing from current build"
              FAIL=1
              continue
            fi
            soname=$(readelf -d "$cur" | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')
            echo "=== $name: $(basename "$ref") vs $(basename "$cur") (SONAME $soname)"
            if [ "$major" = "0" ]; then
              case "$soname" in
                *"$version"*) ;;
                *)
                  echo "FAIL: pre-1.0 SONAME '$soname' does not carry full version '$version'"
                  FAIL=1
                  ;;
              esac
            fi
            if ! abidiff --leaf-changes-only \
                 --suppressions tools/config/abi-supprs.abignore \
                 "$ref" "$cur" > /tmp/abidiff-$name.txt; then
              if [ "$major" = "0" ]; then
                echo "pre-1.0 ABI change in $name (release-specific SONAME allows it):"
                head -40 /tmp/abidiff-$name.txt
              else
                echo "ABI BREAK in $name:"
                cat /tmp/abidiff-$name.txt
                FAIL=1
              fi
            else
              head -5 /tmp/abidiff-$name.txt || true
            fi
          done
          exit $FAIL
