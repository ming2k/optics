name: ci-cross

# Cross-platform gate: native Windows + macOS builds, plus a Linux-hosted
# zig-cc compile check that keeps Windows-only translation units honest
# without needing a Windows runner for every iteration.
#
# Suites: 'integration'/'bench'/'fuzz' need a real GPU (or lavapipe) — the
# GPU-less GitHub runners skip them here. The 'unit' suite is designed to
# stay green without a Vulkan ICD (see tests/flux/integration/meson.build).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: build & test (windows-2022, MSYS2 UCRT64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Slang compiler
        shell: pwsh
        run: |
          $ver = "2026.21"
          Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v$ver/slang-$ver-windows-x86_64.zip" -OutFile slang.zip
          Expand-Archive -Path slang.zip -DestinationPath C:\slang -Force

      # MinGW-w64 GCC has the C23 support this tree needs. The Vulkan
      # headers/loader and text dependencies come from MSYS2 instead of the
      # Windows Vulkan SDK installer, so the job does not depend on MSVC's
      # development shell. fontconfig is Linux-only; DirectWrite is used here.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fribidi

      - name: Configure
        shell: msys2 {0}
        run: |
          export PATH="/c/slang/bin:$PATH"
          meson setup build -Dexamples=false -Dtests=true \
            --buildtype=debugoptimized

      - name: Compile
        shell: msys2 {0}
        run: |
          export PATH="/c/slang/bin:$PATH"
          meson compile -C build

      - name: Test (no GPU suites)
        shell: msys2 {0}
        run: |
          export PATH="/c/slang/bin:$PATH"
          meson test -C build --print-errorlogs \
            --no-suite integration --no-suite bench --no-suite fuzz

  macos:
    name: build & test (macos-15-intel, MoltenVK)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install meson ninja \
            molten-vk vulkan-loader vulkan-headers \
            freetype harfbuzz fribidi

      # Homebrew has no Slang formula. Fetch the pinned official x86_64 build
      # so the same compiler version is used on every CI platform.
      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          sudo mkdir -p /opt/slang
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-macos-x86_64.tar.gz" | sudo tar -xz -C /opt/slang
          echo "/opt/slang/bin" >> "$GITHUB_PATH"

      # Homebrew's vulkan-loader ships vulkan.pc; MoltenVK is plugged in as
      # the ICD. flux auto-enables VK_KHR_portability_enumeration /
      # VK_KHR_portability_subset when advertised (required by MoltenVK).
      - name: Configure
        run: |
          meson setup build -Dexamples=false -Dtests=true \
            -Dfreetype2:harfbuzz=disabled -Dharfbuzz:cairo=disabled

      - name: Compile
        run: meson compile -C build

      - name: Test (no GPU suites)
        env:
          VK_ICD_FILENAMES: /usr/local/share/vulkan/icd.d/MoltenVK_icd.json
        run: |
          meson test -C build --print-errorlogs \
            --no-suite integration --no-suite bench --no-suite fuzz

  windows-zig-compile-check:
    name: windows TU compile check (zig cc, ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan + FreeType headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev libfreetype-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Compile-check every Windows-only translation unit (Win32 backend,
      # DirectWrite font resolution) against zig's bundled MinGW headers.
      # Discovery-based: new *_win32.c / *_directwrite.c files join the gate
      # automatically.
      - name: Compile-check Windows translation units
        run: |
          files=$(git ls-files 'libs/**/*.c' | grep -E '_(win32|directwrite)\.c$' || true)
          if [ -z "$files" ]; then
            echo "no Windows-only TUs yet — nothing to check"
            exit 0
          fi
          echo "$files" | xargs tools/ci/zig-win32-check.sh \
            -Ilibs/flux/include -Ilibs/flux/text/include -Ilibs/flux/text/src \
            -Ilibs/lens/include -Ilibs/iris/include -Ilibs/iris/src \
            -I/usr/include/freetype2 \
            -DFLUX_HAVE_CANVAS=1 -DFLUX_HAVE_SCENE=1 \
            -DFLUX_HAVE_COMPUTE=1 -DFLUX_HAVE_EFFECT=1
