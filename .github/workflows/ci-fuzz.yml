name: ci-fuzz

# Fuzzing gate. Two modes:
#
#   * PR smoke (pull_request): builds the harnesses with libFuzzer
#     (clang + -fsanitize=fuzzer,address), replays the committed seed
#     corpus through the real fuzzing engine, and runs a short bounded
#     campaign per target so a fresh crash is caught within minutes of
#     landing, not days later.
#
#   * Daily long-run (schedule): the same targets for 5 minutes each
#     with -fork=1 to parallelise across cores. Crashes are uploaded as
#     workflow artifacts; a crashing input found here must be
#     minimised and committed back into the seed corpus as a
#     regression test.
#
# The libFuzzer availability probe lives in the root meson.build
# (libfuzzer_enabled); GCC-only toolchains degrade to standalone
# harnesses, so this job pins clang explicitly.

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  libfuzzer:
    name: libFuzzer (${{ matrix.target }}, clang)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each entry carries its binary directory and seed-corpus directory.
        # They used to be re-derived from `${{ matrix.target }}` by a `case`
        # block in every step, which duplicated the list three times and had
        # already drifted: fuzz_lens_store builds under tests/lens/fuzz but the
        # steps looked for it under tests/flux/fuzz, so that target failed to
        # exec on every run. One entry per target makes that drift impossible,
        # and adding a harness is a one-line change here.
        include:
          - target: fuzz_path_flatten
            dir: tests/flux/fuzz
            corpus: tests/flux/fuzz/corpus/path_flatten
          - target: fuzz_text_shape
            dir: tests/flux/fuzz
            corpus: tests/flux/fuzz/corpus/text_shape
          - target: fuzz_coverage_raster
            dir: tests/flux/fuzz
            corpus: tests/flux/fuzz/corpus/coverage_raster
          - target: fuzz_glb_parse
            dir: tests/flux/fuzz
            corpus: tests/flux/fuzz/corpus/glb_parse
          - target: fuzz_lens_store
            dir: tests/lens/fuzz
            corpus: tests/lens/fuzz/corpus/lens_store
          - target: fuzz_svg_parse
            dir: tests/svg/fuzz
            corpus: tests/svg/fuzz/corpus/svg_parse
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ninja-build pkg-config \
            libvulkan-dev libfreetype-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - name: Configure (libFuzzer + ASan)
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup build -Dfuzz=true -Dexamples=false -Dtests=true \
            --buildtype=debugoptimized \
            -Db_sanitize=address \
            -Db_lundef=false

      - name: Compile
        run: meson compile -C build

      # The standalone driver (fuzz_main.c) is used by `meson test`; here
      # we invoke the libFuzzer-linked binaries directly, so the suite
      # filters keep the plain-test runner from double-running them.
      - name: Replay committed seed corpus (regression gate)
        run: |
          set -e
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=1 \
            ./build/${{ matrix.dir }}/${{ matrix.target }} \
              -runs=0 "${{ matrix.corpus }}"

      - name: Bounded fuzz campaign
        id: campaign
        run: |
          set -e
          # PR smoke: 60s. Daily run: 300s (5 min) per target.
          runs_per_target=60
          if [ "${{ github.event_name }}" = "schedule" ]; then
            runs_per_target=300
          fi
          mkdir -p /tmp/fuzz-corpus /tmp/fuzz-artifacts
          # -fork=1 parallelises across cores; -ignore_crashes=0 makes any
          # finding fail the job immediately.
          ASAN_OPTIONS=abort_on_error=1:detect_leaks=1 \
            timeout 600 ./build/${{ matrix.dir }}/${{ matrix.target }} \
              -fork=1 -ignore_crashes=0 \
              -max_total_time=$runs_per_target \
              -rss_limit_mb=2560 \
              -artifact_prefix=/tmp/fuzz-artifacts/ \
              /tmp/fuzz-corpus "${{ matrix.corpus }}"

      # Corpus feedback loop (daily runs only): the campaign's explored
      # corpus — every input that reached new coverage — is uploaded as
      # an artifact so the next maintainer action can fold it back into
      # the committed seeds (tests/*/fuzz/corpus/*). Without this, every
      # cron run re-explores from the same starting set. Fold manually:
      # download the artifact, run each file through the standalone
      # driver (meson test --suite fuzz), dedupe by coverage if large,
      # and commit the survivors as a "fuzz corpus refresh" commit.
      - name: Upload explored corpus (daily)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: explored-corpus-${{ matrix.target }}
          path: /tmp/fuzz-corpus/
          if-no-files-found: ignore

      - name: Upload crash artifacts
        if: failure() && steps.campaign.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ matrix.target }}
          path: /tmp/fuzz-artifacts/
          if-no-files-found: ignore
