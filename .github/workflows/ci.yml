name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Format check
        run: ./tools/format.sh --check

  workflow-lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub rejects a workflow file whose YAML is invalid *as a whole*:
      # every job in it is silently disabled. That is exactly how
      # ci-cross.yml (native Windows + macOS/Cocoa + zig gates) went dark
      # for weeks. actionlint runs from this healthy workflow and fails the
      # PR on any workflow syntax or expression error. shellcheck/pyflakes
      # are disabled here — this gate's job is workflow validity, not shell
      # style.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

  build-and-test:
    name: build & test (ubuntu-24.04, ${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tree bakes shaders in with C23 #embed (GCC >= 15, Clang >= 19).
          # ubuntu-24.04 packages clang-19 but no GCC with #embed, so the GCC
          # leg is the gcc-15 job below (Fedora container).
          - config: release
            cc: clang-19
            cxx: clang++-19
          - config: asan-ubsan
            cc: clang-19
            cxx: clang++-19
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's ubuntu image ships Meson 1.3, below this project's 1.8 floor.
      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      # clang-tidy configures and compiles the shader-bearing libraries, so
      # the compiler and Slang toolchain must exist before the analysis step.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-19 lld ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev fonts-noto-cjk

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      # Wayland listener contract (ADR-0145): libwayland abort()s the whole
      # process when the compositor sends an event whose slot in the wl_proxy
      # listener table is NULL.
      - name: Wayland listener contract
        run: python3 tools/check_listeners.py

      - name: Configure (release)
        if: matrix.config == 'release'
        run: |
          meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Configure (asan+ubsan)
        if: matrix.config == 'asan-ubsan'
        run: |
          meson setup build -Dexamples=true -Dtests=true \
            --buildtype=debugoptimized \
            -Db_sanitize=address,undefined \
            -Db_lundef=false

      - name: Compile
        run: meson compile -C build

      # The pyramid runs as named gates. A failure names the layer instead of
      # disappearing inside one aggregate run.
      - name: "Test (headless: unit + e2e + lint)"
        run: |
          meson test -C build --print-errorlogs \
            --suite unit --suite e2e --suite lint

      - name: "Test (integration: Lavapipe via VK_ICD_FILENAMES)"
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # The runner has no GPU; Phase B0's device_hardware gate otherwise
          # deliberately fails on llvmpipe. The software lane reports the
          # device and still asserts the compute prerequisites.
          OPTICS_GFX_ALLOW_SOFTWARE_DEVICE: 1
          # Leak detection & diagnostic hardening are ON: the root meson.build
          # registers the default 'sanitizer' test setup (active under any b_sanitize)
          # that binds LSAN_OPTIONS (tools/config/lsan.supp), abort behaviors, and timeouts.
        run: meson test -C build --suite integration --print-errorlogs

  feature-matrix:
    name: feature matrix (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no-ui
            flags: -Dtext=false
          - name: no-motion
            flags: -Dmotion=false
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-19 lld ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev fonts-noto-cjk

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - name: Configure reduced feature build
        run: |
          meson setup build ${{ matrix.flags }} -Dtests=true -Dexamples=false \
            --buildtype=release

      - name: Compile
        run: meson compile -C build

      - name: Test (headless)
        run: |
          meson test -C build --print-errorlogs \
            --suite unit --suite e2e --suite lint

  gcc-build:
    # GCC 15 is the other #embed-capable compiler. ubuntu-24.04 has none, so
    # this job runs in a Fedora 42 container (GCC 15, wayland-protocols >= 1.32).
    # It builds optimised with examples: optimisation is what exposes undefined
    # behaviour (an uninitialised pointer in test_svg_geometry once became a
    # wild write only at -O2 while every -O0 leg stayed green), and a second
    # compiler finds what one compiler's diagnostics and codegen hide.
    name: build (gcc-15, fedora:42)
    runs-on: ubuntu-24.04
    container: fedora:42
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            gcc gcc-c++ git ninja-build pkgconf-pkg-config python3-pip curl tar gzip \
            vulkan-headers vulkan-loader-devel vulkan-validation-layers mesa-vulkan-drivers \
            freetype-devel harfbuzz-devel fontconfig-devel fribidi-devel \
            wayland-devel wayland-protocols-devel libxkbcommon-devel systemd-devel \
            google-noto-sans-cjk-fonts
          python3 -m pip install 'meson>=1.8.0'

      - uses: actions/checkout@v4

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | tar -xz -C /usr/local

      - name: Configure
        run: meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Compile
        run: meson compile -C build

      - name: "Test (headless: unit + e2e + lint)"
        run: |
          meson test -C build --print-errorlogs \
            --suite unit --suite e2e --suite lint

      - name: "Test (integration: Lavapipe)"
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          OPTICS_GFX_ALLOW_SOFTWARE_DEVICE: 1
        run: meson test -C build --suite integration --print-errorlogs

  rust-crates:
    name: rust crates (workspace)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-19 lld ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: cargo fmt + clippy + test (dynamic & static)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          OPTICS_STATIC=1 cargo test --workspace --locked
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

  rust-crates-msrv:
    name: rust crates (MSRV 1.85.0)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-19 lld ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: Check workspace on MSRV
        run: cargo +1.85.0 check --workspace --all-targets --locked
