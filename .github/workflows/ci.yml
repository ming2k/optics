name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format (pinned 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Formatting is locked to a major version: output drifts between
      # clang-format releases, so "whatever the runner ships" would flake
      # on image updates. The pin matches tools/guardrails/formatting.py.
      - name: Install pinned clang-format
        run: |
          sudo install -d /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/keyrings/llvm.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-22
          sudo update-alternatives --install /usr/bin/clang-format clang-format \
            /usr/bin/clang-format-22 100
          sudo update-alternatives --set clang-format /usr/bin/clang-format-22

      - name: Format check
        run: ./tools/optics check format

  workflow-lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub rejects a workflow file whose YAML is invalid *as a whole*:
      # every job in it is silently disabled. That is exactly how
      # ci-cross.yml (native Windows + macOS/Cocoa + zig gates) went dark
      # for weeks. actionlint runs from this healthy workflow and fails the
      # PR on any workflow syntax or expression error. shellcheck/pyflakes
      # are disabled here — this gate's job is workflow validity, not shell
      # style.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

  build-and-test:
    name: build & test (ubuntu-24.04, ${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [release, asan-ubsan]
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      # GitHub's ubuntu image ships Meson 1.3, below this project's 1.8 floor.
      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      # clang-tidy configures and compiles the shader-bearing libraries, so
      # the compiler and Slang toolchain must exist before the analysis step.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev fonts-noto-cjk

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      # Material boundary (ADR-0063): flux owns rendering mechanism and must
      # not reference any named material; materials live in prism.
      - name: Material boundary check
        run: ./tools/optics check boundary

      # One release, one version: every library's *_VERSION_* macros
      # must equal meson.project_version(). (flux-scene-graph shipped
      # a hard-coded "0.0.29" string against 0.0.36 headers; anim sat
      # at 0.0.1 for seven months. Both invisible until this check.)
      - name: Version lockstep check
        run: ./tools/optics check lockstep

      # Static analysis (clang-tidy, clang + compile_commands). Baseline
      # policy: zero warnings; fix, don't silence. Platform TUs that only
      # compile under their own backend are cross-checked in ci-cross.
      - name: clang-tidy
        run: |
          CC=clang meson setup build-tidy -Dtests=true -Dexamples=false \
            --buildtype=debug -Dfreetype2:harfbuzz=disabled -Dharfbuzz:cairo=disabled
          ./tools/optics check tidy --build-dir build-tidy

      # Library stdout guardrail: diagnostics go to stderr, never stdout —
      # a consumer's stdout may be an IPC wire (e.g. the portal prompter).
      - name: No library stdout writes
        run: ./tools/optics check stdout

      # Wayland listener contract (ADR-0145): libwayland abort()s the whole
      # process when the compositor sends an event whose slot in the wl_proxy
      # listener table is NULL. 0.0.72 shipped exactly that in
      # wp_presentation_feedback (missing sync_output), killing consumers on
      # the first presented frame. The check is hermetic — it reads the pinned
      # contract in tools/config/wayland-listeners.toml, not the host's
      # protocol corpus — so it does not depend on installed Wayland headers.
      - name: Wayland listener contract
        run: ./tools/optics check listeners

      # Symbol reference freshness: docs/reference/symbols.md is generated
      # from the installed headers (tools/guardrails/symbols.py). It drifted
      # silently before this check existed (removed symbols lingered,
      # new ones never appeared).
      - name: symbols.md freshness
        run: ./tools/optics check symbols

      # Documentation integrity & audience firewall verification (ADR-0125)
      - name: Documentation integrity check
        run: ./tools/optics check docs

      - name: Configure (release)
        if: matrix.config == 'release'
        run: |
          meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Configure (asan+ubsan)
        if: matrix.config == 'asan-ubsan'
        run: |
          meson setup build -Dexamples=true -Dtests=true \
            --buildtype=debugoptimized \
            -Db_sanitize=address,undefined

      - name: Compile
        run: meson compile -C build

      - name: Test (Lavapipe via VK_ICD_FILENAMES)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # Leak detection & diagnostic hardening are ON: the root meson.build
          # registers the default 'sanitizer' test setup (active under any b_sanitize)
          # that binds LSAN_OPTIONS (tools/config/lsan.supp), abort behaviors, and timeouts.
        run: meson test -C build --no-suite bench --print-errorlogs

  clang-build:
    name: build (clang, ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev fonts-noto-cjk

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      # --buildtype=release on purpose. The matrix legs run gcc at release and
      # gcc at -O0 under asan-ubsan; clang at -O0 adds little and compiles away
      # nothing, so clang-specific miscompilation of undefined behaviour stayed
      # ungated. It did: test_svg_geometry read an uninitialised `geometry`
      # whose `doc` pointer the clang -O2 build turned into a wild write, and
      # every leg was green. Optimising with clang is what this leg is for.
      - name: Configure
        run: meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Compile
        run: meson compile -C build

      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: meson test -C build --no-suite bench --print-errorlogs

  bindings:
    name: rust bindings (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every workspace under bindings/ must be listed here. A workspace
        # that is built by consumers but absent from this matrix is ungated:
        # svg-rs, glyph-rs, vista-rs and transit-rs were, and all four had
        # already drifted on `cargo fmt`/`clippy -D warnings` before this
        # list was completed.
        workspace:
          - flux-rs
          - glyph-rs
          - iris-rs
          - lens-rs
          - prism-rs
          - svg-rs
          - transit-rs
          - vista-rs
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: cargo fmt + clippy + test
        working-directory: bindings/${{ matrix.workspace }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

  bindings-msrv:
    name: rust bindings (MSRV 1.85.0)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: Check all workspaces on MSRV
        run: |
          # Enumerated from bindings/ rather than hard-coded: a workspace that
          # is not listed here is never checked on the declared MSRV.
          status=0
          for manifest in bindings/*/Cargo.toml; do
            echo "::group::MSRV check $manifest"
            cargo +1.85.0 check --manifest-path "$manifest" \
              --workspace --all-targets --locked || status=1
            echo "::endgroup::"
          done
          exit $status
