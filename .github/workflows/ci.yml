name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Format check
        run: ./tools/format.sh --check

  workflow-lint:
    name: workflow lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub rejects a workflow file whose YAML is invalid *as a whole*:
      # every job in it is silently disabled. That is exactly how
      # ci-cross.yml (native Windows + macOS/Cocoa + zig gates) went dark
      # for weeks. actionlint runs from this healthy workflow and fails the
      # PR on any workflow syntax or expression error. shellcheck/pyflakes
      # are disabled here — this gate's job is workflow validity, not shell
      # style.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

  build-and-test:
    name: build & test (ubuntu-24.04, ${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: release
            cc: clang
            cxx: clang++
          - config: asan-ubsan
            cc: gcc-14
            cxx: g++-14
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's ubuntu image ships Meson 1.3, below this project's 1.8 floor.
      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      # clang-tidy configures and compiles the shader-bearing libraries, so
      # the compiler and Slang toolchain must exist before the analysis step.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev fonts-noto-cjk

      - name: Install GCC 14 (ASan lane)
        if: matrix.config == 'asan-ubsan'
        run: sudo apt-get install -y --no-install-recommends gcc-14 g++-14

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      # Wayland listener contract (ADR-0145): libwayland abort()s the whole
      # process when the compositor sends an event whose slot in the wl_proxy
      # listener table is NULL.
      - name: Wayland listener contract
        run: python3 tools/check_listeners.py

      - name: Configure (release)
        if: matrix.config == 'release'
        run: |
          meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Configure (asan+ubsan)
        if: matrix.config == 'asan-ubsan'
        run: |
          meson setup build -Dexamples=true -Dtests=true \
            --buildtype=debugoptimized \
            -Db_sanitize=address,undefined

      - name: Compile
        run: meson compile -C build

      - name: Test (Lavapipe via VK_ICD_FILENAMES)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # Leak detection & diagnostic hardening are ON: the root meson.build
          # registers the default 'sanitizer' test setup (active under any b_sanitize)
          # that binds LSAN_OPTIONS (tools/config/lsan.supp), abort behaviors, and timeouts.
        run: meson test -C build --no-suite bench --print-errorlogs

  clang-build:
    name: build (clang, ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev fonts-noto-cjk

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      # --buildtype=release on purpose. The matrix legs run gcc at release and
      # gcc at -O0 under asan-ubsan; clang at -O0 adds little and compiles away
      # nothing, so clang-specific miscompilation of undefined behaviour stayed
      # ungated. It did: test_reticle_geometry read an uninitialised `geometry`
      # whose `doc` pointer the clang -O2 build turned into a wild write, and
      # every leg was green. Optimising with clang is what this leg is for.
      - name: Configure
        run: meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Compile
        run: meson compile -C build

      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: meson test -C build --no-suite bench --print-errorlogs

  bindings:
    name: rust bindings (workspace)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: cargo fmt + clippy + test
        working-directory: bindings
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

  bindings-msrv:
    name: rust bindings (MSRV 1.85.0)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install Meson >= 1.8
        run: |
          sudo python3 -m pip install --break-system-packages --ignore-installed 'meson>=1.8.0'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Slang compiler
        run: |
          SLANG_VER="2026.21"
          curl -sSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/slang-${SLANG_VER}-linux-x86_64.tar.gz" | sudo tar -xz -C /usr/local

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: Check workspace on MSRV
        run: |
          cargo +1.85.0 check --manifest-path bindings/Cargo.toml \
            --workspace --all-targets --locked
          exit $status
