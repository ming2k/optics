name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (ubuntu-24.04, ${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [release, asan-ubsan]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      # Material boundary (ADR-0063): flux owns rendering mechanism and must
      # not reference any named material; materials live in prism.
      - name: Material boundary check
        run: tools/check-material-boundary.sh

      # Library stdout guardrail: diagnostics go to stderr, never stdout —
      # a consumer's stdout may be an IPC wire (e.g. the portal prompter).
      - name: No library stdout writes
        run: tools/check-no-library-stdout.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config glslang-tools \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Configure (release)
        if: matrix.config == 'release'
        run: |
          meson setup build -Dexamples=true -Dtests=true --buildtype=release

      - name: Configure (asan+ubsan)
        if: matrix.config == 'asan-ubsan'
        run: |
          meson setup build -Dexamples=true -Dtests=true \
            --buildtype=debugoptimized \
            -Db_sanitize=address,undefined

      - name: Compile
        run: meson compile -C build

      - name: Test (Lavapipe via VK_ICD_FILENAMES)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          # LeakSanitizer reports fontconfig / FreeType / FriBidi global-cache
          # allocations that survive process exit; those are system-library
          # behaviour and not bugs in this codebase. Keep the ASAN crash
          # detection but disable leak reporting until those libraries
          # provide leak-free shutdown hooks.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: meson test -C build --no-suite bench --print-errorlogs --timeout-multiplier 4

  clang-build:
    name: build (clang, ubuntu-24.04)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld meson ninja-build pkg-config glslang-tools \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Configure
        run: meson setup build -Dexamples=true -Dtests=true

      - name: Compile
        run: meson compile -C build

      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: meson test -C build --no-suite bench --print-errorlogs

  bindings:
    name: rust bindings (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [flux-rs, lens-rs, iris-rs, prism-rs]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config glslang-tools \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: cargo fmt + clippy + test
        working-directory: bindings/${{ matrix.workspace }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

  bindings-msrv:
    name: rust bindings (MSRV 1.85.0)
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config glslang-tools \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libfreetype-dev libharfbuzz-dev libfontconfig1-dev libfribidi-dev \
            libglfw3-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libsystemd-dev

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Build and install C libraries
        run: |
          meson setup build -Dexamples=false -Dtests=false --buildtype=release
          sudo meson install -C build

      - name: Check all workspaces on MSRV
        run: |
          cargo +1.85.0 check --manifest-path bindings/flux-rs/Cargo.toml \
            --workspace --all-targets --locked
          cargo +1.85.0 check --manifest-path bindings/lens-rs/Cargo.toml \
            --workspace --all-targets --locked
          cargo +1.85.0 check --manifest-path bindings/iris-rs/Cargo.toml \
            --workspace --all-targets --locked
          cargo +1.85.0 check --manifest-path bindings/prism-rs/Cargo.toml \
            --workspace --all-targets --locked
