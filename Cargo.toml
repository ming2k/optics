[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.91"
edition = "2024"
license = "MIT"
repository = "https://github.com/ming2k/optics"
rust-version = "1.85"

[workspace.dependencies]
# External build dependencies (shared across all -sys crates)
bindgen = "0.72"
pkg-config = "0.3"

# Internal build helper
optics-build = { path = "crates/optics-build", version = "0.0.91" }

# Raw FFI (-sys) crates
optics-app-sys = { path = "crates/optics-app-sys", version = "0.0.91" }
optics-gfx-sys = { path = "crates/optics-gfx-sys", version = "0.0.91" }
optics-text-sys = { path = "crates/optics-text-sys", version = "0.0.91" }
optics-window-sys = { path = "crates/optics-window-sys", version = "0.0.91" }
optics-ui-sys = { path = "crates/optics-ui-sys", version = "0.0.91" }

# Safe wrapper crates consumed by higher-layer workspace crates
optics-gfx = { path = "crates/optics-gfx", version = "0.0.91" }
optics-window = { path = "crates/optics-window", version = "0.0.91" }
optics-ui = { path = "crates/optics-ui", version = "0.0.91" }

[profile.dev]
opt-level = 0
