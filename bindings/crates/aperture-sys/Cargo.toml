[package]
name = "aperture-sys"
description = "Raw FFI bindings to aperture (libaperture), generated from <aperture/aperture.h>"
publish = false
links = "aperture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dependencies]
# The types aperture's API speaks are owned by these crates and re-exported,
# so each has ONE Rust definition across the stack.
flux-sys = { path = "../flux-sys" }
iris-sys = { path = "../iris-sys" }
lens-sys = { path = "../lens-sys" }
