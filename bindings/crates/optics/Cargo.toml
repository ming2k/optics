[package]
name = "optics"
description = "High-performance modern C23 graphics and UI engine for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flux = { path = "../flux", version = "0.0.78", optional = true }
glyph = { path = "../glyph", version = "0.0.78", optional = true }
lens = { path = "../lens", version = "0.0.78", optional = true }
iris = { path = "../iris", version = "0.0.78", optional = true }
prism = { path = "../prism", version = "0.0.78", optional = true }
reticle = { path = "../reticle", version = "0.0.78", optional = true }
vista = { path = "../vista", version = "0.0.78", optional = true }
transit = { path = "../transit", version = "0.0.78", optional = true }

[features]
default = ["ui", "platform", "motion"]
canvas = ["dep:flux"]
typography = ["canvas", "dep:glyph"]
ui = ["typography", "dep:lens"]
platform = ["ui", "dep:iris"]
materials = ["canvas", "dep:prism"]
reticle = ["canvas", "dep:reticle"]
vector = ["reticle"]
scene = ["canvas", "dep:vista"]
motion = ["dep:transit"]
