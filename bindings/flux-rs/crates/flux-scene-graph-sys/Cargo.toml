[package]
name = "flux-scene-graph-sys"
description = "Raw FFI bindings to libflux-scene-graph (glTF content layer)"
links = "flux-scene-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dependencies]
# flux-sys is re-exported so the handle types scene-graph borrows
# (flux_frame, flux_camera, flux_device, ...) have ONE Rust definition
# across the stack.
flux-sys = { path = "../flux-sys" }
