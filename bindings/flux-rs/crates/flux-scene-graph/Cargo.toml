[package]
name = "flux-scene-graph"
description = "Safe Rust bindings to flux-scene-graph glTF loading and drawing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flux = { path = "../flux", version = "0.0.10" }
flux-scene-graph-sys = { path = "../flux-scene-graph-sys", version = "0.0.10" }
gltf = { version = "1.4.1", default-features = false, features = ["KHR_materials_unlit", "KHR_texture_transform"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
