[package]
name = "iris"
description = "Safe Rust bindings to iris: L3 application toolkit for the flux/lens stack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "iris_rs"

[dependencies]
iris-sys = { path = "../iris-sys", version = "0.0.9" }
# lens (Rust bindings) is published from a separate repo (../lens-rs); flux
# comes in transitively via lens. Paths work when the repos are siblings
# under a common parent; for other layouts set up a Cargo [patch.crates-io]
# in your workspace, or replace with git URLs / registry versions once
# `lens` / `flux` are published.
lens = { path = "../../../lens-rs/crates/lens", version = "0.0.9" }
lens-sys = { path = "../../../lens-rs/crates/lens-sys", version = "0.0.9" }

[[example]]
name = "hello"
