[package]
name = "lens"
description = "Safe Rust bindings to lens: immediate-mode UI over a retained core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lens-sys = { path = "../lens-sys", version = "0.1.0" }
# flux (Rust bindings) is published from a separate repo (../flux-rs).
# The path works when both repos are siblings under a common parent
# directory; for other layouts set up a Cargo [patch.crates-io] in your
# workspace, or replace this with a git URL / registry version once
# `flux` is published.
flux = { path = "../../../flux-rs/crates/flux", version = "0.1.0" }
