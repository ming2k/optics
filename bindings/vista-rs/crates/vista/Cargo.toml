[package]
name = "vista"
description = "Safe Rust bindings for vista — 3D scene hierarchy and glTF 2.0 asset runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
vista-sys = { path = "../vista-sys", version = "0.0.54" }
flux = { path = "../../../flux-rs/crates/flux", version = "0.0.54" }
gltf = { version = "1.4.1", default-features = false, features = ["KHR_materials_unlit", "KHR_texture_transform"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
