[package]
name = "flux-text-layout"
description = "Layer-1 text layout (line wrapping) on top of flux-text's Layer-0 shaper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# This crate is pure-Rust layout logic ABOVE the bindings, not a binding
# itself; it lives at crates/ (see docs/dev/api-surface-audit.md) and
# depends on the flux-rs workspace by path.
flux-text = { path = "../../bindings/flux-rs/crates/flux-text", version = "0.1.1" }
# flux-text-sys is a direct dep so its `links = "flux-text"` metadata
# (DEP_FLUX_TEXT_RPATHS) is visible to this crate's build.rs, which relays the
# meson-build-tree rpath to the wrap unit-test binary. Not used in source.
flux-text-sys = { path = "../../bindings/flux-rs/crates/flux-text-sys", version = "0.1.1" }
# flux-sys stays a direct dep so DEP_FLUX_RPATHS (libflux.so dir) is visible
# too; libflux_text.so depends on libflux.so at runtime.
flux-sys = { path = "../../bindings/flux-rs/crates/flux-sys", version = "0.1.1" }
