[package]
name = "optics-material-sys"
description = "Raw FFI bindings to material (liboptics_material), generated from <optics/material.h>"
publish = false
links = "optics_material"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# material's C API speaks gfx types (optics_gfx_image, optics_gfx_result, ...). They are
# re-exported from optics-gfx-sys instead of being bindgen-duplicated.
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-gfx-sys/static"]
