[package]
name = "optics-material"
description = "Safe Rust bindings to material: liquid-glass materials on the gfx effect runtime"
publish = false
links = "optics_material_rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
optics-material-sys = { workspace = true }
optics-gfx = { workspace = true }
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-material-sys/static", "optics-gfx/static", "optics-gfx-sys/static"]
