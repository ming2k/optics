[package]
name = "optics-scene-sys"
description = "Raw FFI bindings to scene (liboptics_scene), generated from <optics/scene.h>"
publish = false
links = "optics_scene"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-gfx-sys/static"]
