[package]
name = "optics-scene"
description = "Safe Rust bindings for scene — 3D scene hierarchy and glTF 2.0 asset runtime"
publish = false
links = "optics_scene_rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
optics-scene-sys = { workspace = true }
optics-gfx = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-scene-sys/static", "optics-gfx/static"]
# Opt-in built-in PNG/JPEG decoding for `Scene::from_glb_with_materials` using
# system `libpng` + `libturbojpeg` via pkg-config on non-Windows targets.
# Without this feature, `optics-scene` links no image codecs and callers pass
# their own decoder to `Scene::from_glb_with_materials_and_decoder`.
system-image-codecs = []
