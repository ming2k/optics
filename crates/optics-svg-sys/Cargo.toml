[package]
name = "optics-svg-sys"
description = "Raw FFI bindings to svg (liboptics_svg), the Optics vector-document compiler"
publish = false
links = "optics_svg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# optics-gfx-sys is re-exported so the gfx handles svg speaks have ONE
# Rust definition across the stack, with no casts at the crate seam.
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-gfx-sys/static"]
