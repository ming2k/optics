[package]
name = "optics-text"
description = "Safe Rust bindings for text — HarfBuzz text shaping, layout metrics, and dynamic glyph atlas runtime"
publish = false
links = "optics_text_rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
optics-text-sys = { workspace = true }
optics-gfx = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-text-sys/static", "optics-gfx/static"]
