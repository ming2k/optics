[package]
name = "optics-ui-sys"
description = "Raw FFI bindings to ui (liboptics_ui), generated from <optics/ui.h>"
publish = false
links = "optics_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# optics-gfx-sys is re-exported so the gfx types ui speaks (optics_gfx_canvas,
# optics_gfx_device, optics_gfx_image, ...) have ONE Rust definition across the stack.
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
# Force a static link of the Optics archives; the default links the shared
# objects (docs/how-to/choose-a-static-or-shared-link.md). OPTICS_STATIC /
# OPTICS_DYNAMIC in the environment override it.
static = ["optics-gfx-sys/static"]
