[package]
name = "optics-window-sys"
description = "Raw FFI bindings to iris (libiris), generated from <iris/iris.h>"
publish = false
links = "optics_window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# optics-gfx-sys is re-exported so the seam types iris speaks (flux_canvas,
# flux_device, flux_encoder, ...) have ONE Rust definition across the stack.
optics-gfx-sys = { workspace = true }

[build-dependencies]
optics-build = { workspace = true }
