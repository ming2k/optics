[package]
name = "optics"
description = "High-performance modern C23 graphics and UI engine for Rust"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
optics-gfx = { workspace = true, optional = true }
optics-text = { workspace = true, optional = true }
optics-svg = { workspace = true, optional = true }
optics-material = { workspace = true, optional = true }
optics-scene = { workspace = true, optional = true }
optics-motion = { workspace = true, optional = true }
optics-window = { workspace = true, optional = true }
optics-ui = { workspace = true, optional = true }
optics-app = { workspace = true, optional = true }

[build-dependencies]
optics-build = { workspace = true }

[features]
default = ["app", "motion"]
gfx = ["dep:optics-gfx"]
text = ["gfx", "dep:optics-text"]
svg = ["gfx", "dep:optics-svg"]
material = ["gfx", "dep:optics-material"]
scene = ["gfx", "dep:optics-scene"]
scene-codecs = ["scene", "optics-scene/system-image-codecs"]
motion = ["dep:optics-motion"]
window = ["gfx", "dep:optics-window"]
ui = ["text", "svg", "dep:optics-ui"]
app = ["ui", "window", "dep:optics-app"]
# Force a static link of every enabled Optics module; the default links the
# shared objects (docs/how-to/choose-a-static-or-shared-link.md). There is no
# `dynamic` feature: features are additive, and shared is the default.
# OPTICS_STATIC / OPTICS_DYNAMIC in the environment override it.
static = [
    "optics-gfx?/static",
    "optics-text?/static",
    "optics-svg?/static",
    "optics-material?/static",
    "optics-scene?/static",
    "optics-window?/static",
    "optics-ui?/static",
    "optics-app?/static",
]
