# leak-exempt.toml — resource kinds that cannot have a leak lane, each with a
# reason (ADR-0130, INV-ARCH-LEDGER).
#
# Philosophy, copied from tools/config/abi-supprs.abignore: everything is
# checked by default; an entry here is a reviewed decision, never a shadow
# valve. A `reason` is mandatory — the guardrail fails without one.
#
# What belongs here: a kind with no release verb at all, where the resource is
# returned to the caller by a route that is already accounted (an arena, a
# borrowed view) or is deliberately process-lifetime-immutable. What does NOT
# belong here: "the test is annoying to write". If a kind is releasable, it
# gets a lane in leak-lanes.toml.

[exempt.flux_path]
reason = """
flux_path_create takes a flux_arena and returns memory owned by it; there is no
flux_path_release because the arena is the release verb. Arena-owned memory is
frame- or context-scoped and its lifetime is already asserted by the arena
itself (INV-ARCH-ARENA), so a per-path ledger row would count the same bytes
twice: once at the arena and once per path. The lane that covers this is the
arena's own balance assertion in tests/flux/integration/test_canvas_target_pool.c,
which requires the frame walk to return to its arena watermark.
substitute = "arena balance assertion (INV-ARCH-ARENA, test_canvas_target_pool.c)"
"""
