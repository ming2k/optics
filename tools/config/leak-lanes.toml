# leak-lanes.toml — one leak lane per public resource kind (ADR-0130).
#
# Why this file exists: before it, leak coverage was re-derived by reading
# test files during review. It could not be enumerated, so "is this kind
# covered?" had no machine answer and drift was invisible. Here it is a fact:
# `./tools/gate check leaks` derives the kind inventory from the public
# headers and fails when a kind has neither a lane below nor a reasoned
# exemption in leak-exempt.toml.
#
# Contract for every entry:
#   [kind.<symbol>]
#   scope    = "device" | "context" | "process"   (the ledger scope)
#   lifetime = "frame" | "context" | "process"    (the drain point)
#   lane     = path to an existing test source, registered as a meson test
#
# A lane must assert an *exact* delta against the ledger. A tolerance constant
# is rejected in review: the regression that motivated all of this was an
# off-by-one that a `<= baseline + 2` assertion would have swallowed.

# ---------------------------------------------------------------------------
# flux — device scope
# ---------------------------------------------------------------------------

[kind.flux_image]
scope    = "device"
lifetime = "context"
lane     = "tests/flux/integration/test_resource_leak.c"

scope    = "device"
lifetime = "context"
lane     = "tests/flux/integration/test_resource_leak.c"

